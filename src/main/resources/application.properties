spring.application.name=ipon-challenge

# Database
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ipon_challenge}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — secret MUST be supplied via env in production; the fallback is for local dev only.
jwt.secret=${JWT_SECRET:iponChallengeSecretKey2024VeryLongSecretKeyForHmacSha256Security}
# Short-lived access token (2 hours) — sessions auto-expire; clients re-authenticate.
jwt.expiration=${JWT_EXPIRATION:7200000}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=${PORT:8080}

# --- Hardened error handling: never leak internals to clients ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# --- Request size limits (mitigate large-payload abuse) ---
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

# --- Do not expose actuator details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
