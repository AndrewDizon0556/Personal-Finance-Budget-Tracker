  <!-- Wordmark (for light backgrounds) -->
  <text x="300" y="190" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="118" font-weight="800" letter-spacing="-2">
    <tspan fill="#232A57">Ipon</tspan><tspan fill="#F5B300">Challenge</tspan>
  </text>
  <text x="302" y="248" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="600" letter-spacing="2" fill="#6B7280">PERSONAL BUDGET TRACKER</text>
</svg>
