<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ipon Challenge">
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D5DB4"/>
      <stop offset="0.55" stop-color="#35408E"/>
      <stop offset="1" stop-color="#232A57"/>
    </linearGradient>
    <linearGradient id="ic-gold" x1="160" y1="176" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD94D"/>
      <stop offset="1" stop-color="#F5B300"/>
    </linearGradient>
  </defs>

  <!-- App background squircle -->
  <rect width="512" height="512" rx="116" fill="url(#ic-bg)"/>
  <!-- soft top-left sheen -->
  <rect width="512" height="512" rx="116" fill="white" opacity="0.04"/>

  <!-- Coin -->
  <circle cx="256" cy="296" r="120" fill="url(#ic-gold)"/>
  <circle cx="256" cy="296" r="100" fill="none" stroke="#232A57" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Peso ₱ (stem reads as the "I" in Ipon) -->
  <g stroke="#232A57" stroke-linecap="round" fill="none">
    <path d="M248 224 V372" stroke-width="26"/>
    <path d="M248 228 h26 a48 46 0 0 1 0 92 h-26" stroke-width="26"/>
    <path d="M206 256 H286" stroke-width="16"/>
    <path d="M206 286 H286" stroke-width="16"/>
  </g>

  <!-- Graduation cap resting on the coin -->
  <g>
    <polygon points="256,116 340,152 256,188 172,152" fill="url(#ic-gold)" stroke="#232A57" stroke-opacity="0.25" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="256" cy="152" r="7" fill="#232A57" fill-opacity="0.55"/>
    <path d="M340 152 V196" stroke="url(#ic-gold)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="340" cy="202" r="8" fill="url(#ic-gold)"/>
  </g>
</svg>
