<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ipon Challenge">
  <defs>
    <linearGradient id="ic-bg" x1="40" y1="20" x2="472" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5566C2"/>
      <stop offset="0.5" stop-color="#35408E"/>
      <stop offset="1" stop-color="#1E2450"/>
    </linearGradient>
    <radialGradient id="ic-sheen" cx="0.32" cy="0.22" r="0.9">
      <stop stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ic-coin" cx="0.38" cy="0.30" r="0.92">
      <stop stop-color="#FFE88F"/>
      <stop offset="0.55" stop-color="#FFD23D"/>
      <stop offset="1" stop-color="#E89A00"/>
    </radialGradient>
    <linearGradient id="ic-cap" x1="172" y1="116" x2="340" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE88F"/>
      <stop offset="1" stop-color="#F0A800"/>
    </linearGradient>
    <filter id="ic-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- App background squircle -->
  <rect width="512" height="512" rx="116" fill="url(#ic-bg)"/>
  <!-- Top-left light sheen for depth -->
  <rect width="512" height="512" rx="116" fill="url(#ic-sheen)"/>
  <!-- Glassy inset edge -->
  <rect x="6" y="6" width="500" height="500" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Soft contact shadow so the coin sits in space -->
  <ellipse cx="256" cy="322" rx="116" ry="116" fill="#0F1330" fill-opacity="0.38" filter="url(#ic-soft)"/>

  <!-- Coin -->
  <circle cx="256" cy="296" r="120" fill="url(#ic-coin)"/>
  <!-- Beveled rim + engraved inner ring -->
  <circle cx="256" cy="296" r="118.5" fill="none" stroke="#B97A00" stroke-opacity="0.40" stroke-width="3"/>
  <circle cx="256" cy="296" r="100" fill="none" stroke="#7C4509" stroke-opacity="0.20" stroke-width="6"/>
  <!-- Top highlight arc (metallic sheen) -->
  <path d="M164 244 A108 108 0 0 1 320 206" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="7" stroke-linecap="round"/>

  <!-- Peso ₱ (stem reads as the "I" in Ipon) -->
  <g stroke="#232A57" stroke-linecap="round" fill="none">
    <path d="M248 224 V372" stroke-width="26"/>
    <path d="M248 228 h26 a48 46 0 0 1 0 92 h-26" stroke-width="26"/>
    <path d="M206 256 H286" stroke-width="16"/>
    <path d="M206 286 H286" stroke-width="16"/>
  </g>

  <!-- Graduation cap resting on the coin -->
  <g>
    <!-- cap soft shadow on coin -->
    <ellipse cx="256" cy="190" rx="84" ry="12" fill="#0F1330" fill-opacity="0.20" filter="url(#ic-soft)"/>
    <polygon points="256,116 340,152 256,188 172,152" fill="url(#ic-cap)" stroke="#7C4509" stroke-opacity="0.30" stroke-width="3" stroke-linejoin="round"/>
    <!-- mortarboard top sheen -->
    <polygon points="256,116 340,152 256,152 172,152" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="256" cy="152" r="7" fill="#232A57" fill-opacity="0.55"/>
    <path d="M340 152 V196" stroke="#F0A800" stroke-width="6" stroke-linecap="round"/>
    <circle cx="340" cy="202" r="8" fill="url(#ic-cap)"/>
  </g>
</svg>
